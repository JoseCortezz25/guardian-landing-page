[mcp_servers."Figma Desktop"]
url = "http://127.0.0.1:3845/mcp"

[mcp_servers.chrome-devtools]
args = ["chrome-devtools-mcp@latest"]
command = "npx"

[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"

[mcp_servers.shadcn]
args = [
    "shadcn@latest",
    "mcp",
]
command = "npx"
